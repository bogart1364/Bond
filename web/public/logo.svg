<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Bond">
  <!--
    Bond — the escrow mark.
    Two facing brackets hold a solid square: payer [ value ] payee,
    with the contract as the thing in between. Sharp corners only,
    Base blue #0052ff, paper cream #f7f2ec.
  -->
  <rect width="64" height="64" fill="#0052ff" />
  <g fill="#f7f2ec">
    <rect x="8" y="10" width="8" height="44" />
    <rect x="8" y="10" width="12" height="8" />
    <rect x="8" y="46" width="12" height="8" />
    <rect x="48" y="10" width="8" height="44" />
    <rect x="44" y="10" width="12" height="8" />
    <rect x="44" y="46" width="12" height="8" />
    <rect x="24" y="24" width="16" height="16" />
  </g>
</svg>
