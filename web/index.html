<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bond — non-custodial USDC escrow on Base</title>
    <meta
      name="description"
      content="Bond locks USDC in a verifiable on-chain escrow. The payer shares a link, the payee delivers, and funds move only by the contract's rules — or an arbiter's ruling. Non-custodial, source verified, no account required."
    />
    <meta name="author" content="Bond" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0052FF" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://bond.example/" />

    <!-- Edition selection runs before first paint: stored choice wins,
         otherwise the OS preference. No flash of the wrong paper. -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("bond-theme");
        } catch (e) {
          theme = null;
        }
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bond" />
    <meta property="og:title" content="Bond — non-custodial USDC escrow on Base" />
    <meta
      property="og:description"
      content="Lock USDC in a verifiable on-chain escrow. Share a link, deliver the work, settle by the rules — or by an arbiter's ruling. No account, no custodian."
    />
    <meta property="og:url" content="https://bond.example/" />
    <meta property="og:locale" content="en_US" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Bond — non-custodial USDC escrow on Base" />
    <meta
      name="twitter:description"
      content="Lock USDC in a verifiable on-chain escrow. Share a link, deliver the work, settle by the rules — or by an arbiter's ruling."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
