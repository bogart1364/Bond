[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.31"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./" }]

# Lint policy: mirror OpenZeppelin's own exclusions. `keccak256(abi.encode(..))`
# is the canonical EIP-712 construction — assembly would trade auditability for
# a few gas — and `token`/`owner` are the idiomatic names for these state vars.
[lint]
exclude_lints = ["asm-keccak256", "screaming-snake-case-immutable"]

# Base-flavored fuzzing: deterministic but thorough
[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32

# CI profile: heavier fuzzing
[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 256
depth = 64

# Base Mainnet (8453) — deploy with:
#   forge script script/Deploy.s.sol --rpc-url $BASE_RPC_URL --broadcast --verify
[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
